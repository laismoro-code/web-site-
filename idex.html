<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu blog tech</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Georgia, serif;
      color: #1a202c;
      background-color: #ffffff;
    }
    .header {
      background-color: #163e6e;
      color: #ffffff;
      text-align: center;
      padding: 40px 20px;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .header p {
      font-size: 1.05rem;
    }

    .post-container {
      display: flex;
      align-items: flex-start;
      gap: 20px;              
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .post-icon img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .post-title {
      color: #163e6e;
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .post-author {
      color: #4a5568;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .post-content {
      color: #2d3748;
      font-size: 1.1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>Meu blog tech</h1>
    <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
  </header>


  <main class="post-container">
    
    <div class="post-icon">
      <img src="Gemini_Generated_Image_jfczkmjfczkmjfcz.png" alt="Ícone do post">
    </div>

    <article class="post">
      <h2 class="post-title">Meu primeiro post</h2>
      <p class="post-author">Por: Marcelo Paludetto</p>
      <p class="post-content">
        Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.
      </p>
    </article>

  </main>

</body>
</html>
